<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Society Finance</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-name">Society Finance</span>
      <span id="society-name" class="muted"></span>
    </div>
    <nav class="nav" aria-label="Sections">
      <a href="#events" data-view="events">Events</a>
      <a href="#data" data-view="data">Data</a>
    </nav>
    <button id="open-settings" class="btn ghost small">Settings</button>
  </header>

  <main>
    <div id="view-events" hidden>
      <div id="events-body"></div>
    </div>

    <div id="view-data" hidden>
      <section class="card">
        <h2>Import a spreadsheet</h2>
        <div id="import-body"></div>
      </section>
      <section class="card">
        <h2>Stored data</h2>
        <div id="records-body"></div>
      </section>
      <section class="card">
        <h2>Import history</h2>
        <div id="history-body"></div>
      </section>
    </div>
  </main>

  <dialog id="settings" aria-labelledby="settings-title">
    <div class="dialog-head">
      <h2 id="settings-title">Settings</h2>
      <button class="icon-btn close" aria-label="Close">×</button>
    </div>
    <div class="dialog-body"></div>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="lib/exceljs.min.js"></script>
  <script src="js/util.js"></script>
  <script src="js/schema.js"></script>
  <script src="js/cleaning.js"></script>
  <script src="js/finance.js"></script>
  <script src="js/store.js"></script>
  <script src="js/excel.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/demo.js"></script>
  <script src="js/ui-data.js"></script>
  <script src="js/ui-events.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
