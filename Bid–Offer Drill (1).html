<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Bid–Offer Drill</title>
<style>
  :root {
    --ground: #eef2f0;
    --panel: #ffffff;
    --ink: #13201b;
    --muted: #5b6b64;
    --line: #d5ddd9;
    --accent: #1d5c4a;
    --accent-ink: #ffffff;
    --good: #147a4f;
    --good-bg: #e2f3ea;
    --bad: #b33a2c;
    --bad-bg: #f8e5e2;
    --quote-bg: #13201b;
    --quote-ink: #f2f6f4;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #0f1714; --panel: #17221e; --ink: #e6eeea; --muted: #93a39c;
      --line: #2a3833; --accent: #5fbf9b; --accent-ink: #0c1411;
      --good: #5fcf98; --good-bg: #173327; --bad: #f08a7c; --bad-bg: #3a1f1b;
      --quote-bg: #0a100e; --quote-ink: #e6eeea;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --ground: #0f1714; --panel: #17221e; --ink: #e6eeea; --muted: #93a39c;
    --line: #2a3833; --accent: #5fbf9b; --accent-ink: #0c1411;
    --good: #5fcf98; --good-bg: #173327; --bad: #f08a7c; --bad-bg: #3a1f1b;
    --quote-bg: #0a100e; --quote-ink: #e6eeea;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--ground);
    color: var(--ink);
    font: 18px/1.5 var(--sans);
    padding-inline: 16px;
    padding-block: 20px 48px;
  }
  .wrap { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
  .num { font-variant-numeric: tabular-nums; }

  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 1.35rem; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
  h1 span { color: var(--muted); font-weight: 500; font-size: 0.8em; margin-left: 6px; white-space: nowrap; }

  /* History */
  .history { font-size: 0.85rem; }
  .history-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 6px; }
  .label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
  .table-scroll { overflow-x: auto; max-height: 190px; overflow-y: auto; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 5px 8px 5px 0; border-bottom: 1px solid var(--line); white-space: nowrap; }
  tr:last-child td { border-bottom: 0; }
  th { font-weight: 600; color: var(--muted); position: sticky; top: 0; background: var(--ground); }
  td.r, th.r { text-align: right; padding-right: 0; }
  tr.current td { color: var(--accent); font-weight: 600; }
  .empty { color: var(--muted); padding: 8px 0; margin: 0; }
  .linkbtn { background: none; border: 0; color: var(--muted); font: inherit; font-size: 0.8rem; text-decoration: underline; cursor: pointer; padding: 4px; }
  .linkbtn:hover { color: var(--ink); }
  .confirm { display: flex; gap: 8px; align-items: center; font-size: 0.8rem; color: var(--muted); }

  /* Score strip */
  .score { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .score-figs { display: flex; gap: 20px; align-items: baseline; }
  .fig b { font-size: 1.6rem; font-weight: 700; display: block; line-height: 1.1; }
  .fig small { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }

  /* Question card */
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 22px 20px; display: flex; flex-direction: column; gap: 18px; }
  .prompt { font-size: 1.3rem; line-height: 1.45; margin: 0; text-wrap: pretty; }
  .quote {
    display: inline-block; font-family: var(--mono); font-weight: 700;
    background: var(--quote-bg); color: var(--quote-ink);
    padding: 1px 9px; border-radius: 5px; white-space: nowrap; font-size: 0.95em;
  }
  .trades { font-family: var(--mono); font-weight: 600; }

  .options { display: flex; flex-direction: column; gap: 10px; }
  .opt {
    display: flex; gap: 12px; align-items: flex-start; width: 100%; text-align: left;
    font: inherit; font-size: 1.08rem; color: var(--ink);
    background: var(--panel); border: 1.5px solid var(--line); border-radius: 8px;
    padding: 13px 14px; cursor: pointer; transition: border-color .12s, background .12s;
  }
  .opt:hover:not(:disabled) { border-color: var(--accent); }
  .opt:disabled { cursor: default; }
  .opt kbd { font-family: var(--mono); font-size: 0.8rem; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; margin-top: 2px; flex: none; }
  .opt.is-correct { border-color: var(--good); background: var(--good-bg); }
  .opt.is-wrong { border-color: var(--bad); background: var(--bad-bg); }
  .opt.dim { opacity: 0.55; }

  .textrow { display: flex; gap: 10px; flex-wrap: wrap; }
  .textrow input {
    flex: 1 1 160px; min-width: 0; font: inherit; font-size: 1.3rem; font-family: var(--mono);
    padding: 11px 14px; border: 1.5px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--ink);
  }
  .textrow input:focus { outline: none; border-color: var(--accent); }
  .hint { font-size: 0.85rem; color: var(--muted); margin: -8px 0 0; }
  .hint.err { color: var(--bad); font-weight: 600; }

  .btn {
    font: inherit; font-weight: 600; font-size: 1.05rem; cursor: pointer;
    background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 8px; padding: 12px 20px;
  }
  .btn.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--line); font-size: 0.9rem; padding: 8px 14px; }
  .btn:disabled { opacity: 0.5; cursor: default; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  .feedback { border-radius: 8px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; }
  .feedback.good { background: var(--good-bg); }
  .feedback.bad { background: var(--bad-bg); }
  .verdict { font-weight: 700; }
  .good .verdict { color: var(--good); }
  .bad .verdict { color: var(--bad); }
  .explain { margin: 0; font-size: 1rem; }
  .next-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  .keys { font-size: 0.8rem; color: var(--muted); }

  @media (max-width: 420px) {
    body { font-size: 17px; }
    .prompt { font-size: 1.18rem; }
    .card { padding: 18px 14px; }
    .keys { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
<div class="wrap">
  <header>
    <h1>Bid–Offer Drill <span>market-making reps</span></h1>
  </header>

  <section class="history" aria-labelledby="hist-label">
    <div class="history-head">
      <span class="label" id="hist-label">Past sessions</span>
      <span id="clear-slot"><button class="linkbtn" id="clear-btn" type="button">Clear history</button></span>
    </div>
    <div id="history"></div>
  </section>

  <section class="score" aria-live="polite">
    <div class="score-figs">
      <div class="fig"><b class="num" id="s-score">0 / 0</b><small>This session</small></div>
      <div class="fig"><b class="num" id="s-acc">—</b><small>Accuracy</small></div>
      <div class="fig"><b class="num" id="s-streak">0</b><small>Streak</small></div>
    </div>
    <button class="btn ghost" id="new-session" type="button">Start new session</button>
  </section>

  <main class="card" id="card"></main>
</div>

<script>
(function () {
  "use strict";

  // ---------- helpers ----------
  const rnd = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
  const pick = (arr) => arr[rnd(0, arr.length - 1)];
  const shuffle = (arr) => {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) { const j = rnd(0, i); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  };
  const clean = (x) => String(Number(x.toFixed(4)));
  const q = (text) => '<span class="quote">' + text + '</span>';

  // Reads a typed answer: a plain number or simple arithmetic like "88.5-87.5".
  // Hand-rolled parser (no eval) for + − × ÷ and parentheses.
  function evalAnswer(raw) {
    const s = String(raw).replace(/[\s$]/g, "").replace(/[−–—]/g, "-").replace(/[×x]/gi, "*").replace(/÷/g, "/").replace(/,/g, ".");
    if (!s || !/^[0-9.+\-*/()]+$/.test(s)) return NaN;
    let i = 0;
    const expr = () => {
      let v = term();
      while (s[i] === "+" || s[i] === "-") { const op = s[i++]; const r = term(); v = op === "+" ? v + r : v - r; }
      return v;
    };
    const term = () => {
      let v = factor();
      while (s[i] === "*" || s[i] === "/") { const op = s[i++]; const r = factor(); v = op === "*" ? v * r : v / r; }
      return v;
    };
    const factor = () => {
      if (s[i] === "-") { i++; return -factor(); }
      if (s[i] === "+") { i++; return factor(); }
      if (s[i] === "(") { i++; const v = expr(); if (s[i++] !== ")") throw 0; return v; }
      const m = /^(\d+\.?\d*|\.\d+)/.exec(s.slice(i));
      if (!m) throw 0;
      i += m[0].length;
      return parseFloat(m[0]);
    };
    try { const v = expr(); return i === s.length && isFinite(v) ? v : NaN; } catch (e) { return NaN; }
  }

  // Price conventions: whole numbers, halves, quarters, nickels.
  function pickStyle() {
    return pick([
      { tick: 1, dp: 0, lo: 8, hi: 180 },
      { tick: 1, dp: 0, lo: 8, hi: 180 },
      { tick: 0.5, dp: 1, lo: 40, hi: 400 },
      { tick: 0.25, dp: 2, lo: 200, hi: 1200 },
      { tick: 0.05, dp: 2, lo: 100, hi: 2000 }
    ]);
  }

  // A random two-sided quote, built in integer ticks to avoid float drift.
  function makeQuote() {
    const style = pickStyle();
    const bidT = rnd(style.lo, style.hi);
    const sprT = rnd(1, 6);
    const bid = bidT * style.tick, ask = (bidT + sprT) * style.tick;
    return {
      bid, ask, style, bidT, sprT,
      px: (ticks) => (ticks * style.tick).toFixed(style.dp),
      spread: sprT * style.tick,
      b: bid.toFixed(style.dp),
      a: ask.toFixed(style.dp),
      s: clean(sprT * style.tick),
      mid: clean((bid + ask) / 2),
      text: bid.toFixed(style.dp) + " at " + ask.toFixed(style.dp)
    };
  }

  // ---------- question templates ----------
  const templates = [
    function readQuote() {
      const Q = makeQuote();
      return {
        tag: "Reading a quote",
        prompt: "The market is " + q(Q.text) + ". Which price do you sell at, and which do you buy at?",
        options: [
          { t: "Sell at " + Q.b + ", buy at " + Q.a, ok: true },
          { t: "Sell at " + Q.a + ", buy at " + Q.b },
          { t: "Both at the mid, " + Q.mid },
          { t: "Sell at " + Q.a + ", buy at " + Q.a }
        ],
        explain: Q.b + " is the bid (what someone will pay you), so you sell there; " + Q.a + " is the offer, so you buy there."
      };
    },

    function aggressorVerbs() {
      const v = pick([
        { s: "You <b>lift an offer</b>.", buy: true, why: "Lifting an offer means taking someone's offer, so you bought." },
        { s: "You <b>hit a bid</b>.", buy: false, why: "Hitting a bid means selling into someone's bid, so you sold." },
        { s: "Someone <b>hits your bid</b>.", buy: true, why: "They sold into your bid, so you're the buyer." },
        { s: "Someone <b>lifts your offer</b>.", buy: false, why: "They bought your offer, so you're the seller." }
      ]);
      return {
        tag: "Hit or lift",
        prompt: v.s + " Did you buy or sell?",
        options: [{ t: "Bought", ok: v.buy }, { t: "Sold", ok: !v.buy }],
        fixedOrder: true,
        explain: v.why
      };
    },

    function flattenPosition() {
      const Q = makeQuote();
      const n = rnd(1, 12);
      const long = Math.random() < 0.5;
      const wrongN = pick([n + rnd(1, 3), n * 2]);
      const sell = (k) => "Sell " + k + " — hit the bid at " + Q.b;
      const buy = (k) => "Buy " + k + " — lift the offer at " + Q.a;
      return {
        tag: "Getting flat",
        prompt: "The market is " + q(Q.text) + ". You're <b>" + (long ? "long " : "short ") + n + "</b>. What single trade makes you flat?",
        options: long
          ? [{ t: sell(n), ok: true }, { t: "Sell " + n + " — lift the offer at " + Q.a }, { t: buy(n) }, { t: sell(wrongN) }]
          : [{ t: buy(n), ok: true }, { t: "Buy " + n + " — hit the bid at " + Q.b }, { t: sell(n) }, { t: buy(wrongN) }],
        explain: long
          ? "Long " + n + " means you must sell " + n + "; selling immediately means hitting the bid at " + Q.b + "."
          : "Short " + n + " means you must buy " + n + "; buying immediately means lifting the offer at " + Q.a + "."
      };
    },

    function tradeSequence() {
      const Q = makeQuote();
      let trades, net;
      do {
        trades = Array.from({ length: rnd(2, 4) }, () => ({ buy: Math.random() < 0.5, n: rnd(1, 10) }));
        net = trades.reduce((s, t) => s + (t.buy ? t.n : -t.n), 0);
      } while (net === 0);
      const gross = trades.reduce((s, t) => s + t.n, 0);
      const k = Math.abs(net);
      const wrongK = gross !== k ? gross : k + 2;
      const words = trades.map((t, i) => (i ? "then " : "") + (t.buy ? "buy " : "sell ") + t.n);
      const posName = (x) => (x > 0 ? "Long " : "Short ") + Math.abs(x);
      const fix = (x, sizeOverride) => {
        const s = sizeOverride || Math.abs(x);
        return x < 0 ? "buy " + s + ", lifting the offer at " + Q.a : "sell " + s + ", hitting the bid at " + Q.b;
      };
      const wrongVerb = net < 0 ? "buy " + k + ", hitting the bid at " + Q.b : "sell " + k + ", lifting the offer at " + Q.a;
      const math = trades.map((t, i) => (t.buy ? (i ? "+ " : "+") : (i ? "− " : "−")) + t.n).join(" ");
      return {
        tag: "Trade sequence",
        prompt: "The market is " + q(Q.text) + ". Starting flat, you <span class=\"trades\">" + words.join(", ") + "</span>. What's your position, and what trade flattens it?",
        options: [
          { t: posName(net) + " — " + fix(net), ok: true },
          { t: posName(-net) + " — " + fix(-net) },
          { t: posName(net) + " — " + wrongVerb },
          { t: posName(net > 0 ? wrongK : -wrongK) + " — " + fix(net, wrongK) }
        ],
        explain: math + " = " + (net > 0 ? "+" : "−") + k + ", so you're " + posName(net).toLowerCase() + "; to flatten, " + fix(net) + "."
      };
    },

    function spread() {
      const Q = makeQuote();
      return {
        tag: "Spread",
        prompt: "The market is " + q(Q.text) + ". What's the spread?",
        text: true,
        placeholder: "e.g. " + clean(Q.spread + 1),
        check: (v) => Math.abs(v - Q.spread) < 1e-6,
        answer: Q.s,
        explain: "Offer minus bid: " + Q.a + " − " + Q.b + " = " + Q.s + "."
      };
    },

    function hedger() {
      const h = pick([
        { who: "An airline", act: "buys next quarter's jet fuel from a market maker", risk: "fuel costs" },
        { who: "A farmer", act: "sells next season's corn to a market maker", risk: "the crop price" },
        { who: "A power company", act: "buys next winter's natural gas from a market maker", risk: "fuel costs" }
      ]);
      return {
        tag: "Why hedgers pay",
        prompt: h.who + " " + h.act + ", crossing the spread instead of waiting for a better price. Why pay the spread?",
        options: [
          { t: "For immediacy: they want the price locked in now, with certainty", ok: true },
          { t: "They expect the price to move in their favour" },
          { t: "Crossing the spread gets them a better price than the mid" },
          { t: "Market makers only trade with hedgers who pay the spread" }
        ],
        explain: "A hedger isn't trying to beat the market. The spread is the fee for removing the risk on " + h.risk + " right now, instead of carrying it while they wait."
      };
    },

    // ----- Market maker's seat: you set the bid and offer -----

    function mmTwoWay() {
      const st = pickStyle();
      const f = rnd(st.lo + 10, st.hi), e = rnd(1, 4);
      const p = (t) => (t * st.tick).toFixed(st.dp);
      const edge = clean(e * st.tick);
      return {
        tag: "Market maker · Showing a price",
        prompt: "You're the market maker. Your fair value is " + q(p(f)) + " and you want to earn " + edge + " on each side. What two-way price do you show?",
        options: [
          { t: p(f - e) + " at " + p(f + e), ok: true },
          { t: p(f + e) + " at " + p(f - e) },
          { t: p(f) + " at " + p(f + 2 * e) },
          { t: p(f - 2 * e) + " at " + p(f) }
        ],
        explain: "Bid below fair, offer above: " + p(f - e) + " at " + p(f + e) + ". You buy " + edge + " under value and sell " + edge + " over it."
      };
    },

    function mmRoundTrip() {
      const Q = makeQuote();
      const n = rnd(1, 20);
      const legs = shuffle(["<b>hits your bid</b> for " + n, "<b>lifts your offer</b> for " + n]);
      const pnl = Q.spread * n;
      return {
        tag: "Market maker · Round trip",
        prompt: "You're making a market at " + q(Q.text) + ". One client " + legs[0] + ", then another " + legs[1] + ". What's your total profit?",
        text: true,
        placeholder: "e.g. " + clean(Q.spread),
        check: (v) => Math.abs(v - pnl) < 1e-6,
        answer: clean(pnl),
        explain: "You bought " + n + " at " + Q.b + " and sold " + n + " at " + Q.a + ", so you're flat and earned the spread: " + Q.s + " × " + n + " = " + clean(pnl) + "."
      };
    },

    function mmGotFilled() {
      const Q = makeQuote();
      const n = rnd(1, 15);
      const lifted = Math.random() < 0.5;
      const half = clean(Q.spread / 2), edge = clean((Q.spread / 2) * n);
      const opt = (pos, gain) => pos + " " + n + ", " + (gain ? "earned " + edge + " vs the mid" : "lost " + edge + " vs the mid");
      return {
        tag: "Market maker · Getting filled",
        prompt: "You're quoting " + q(Q.text) + ". A client " + (lifted ? "<b>lifts your offer</b>" : "<b>hits your bid</b>") + " for " + n + ". What's your position, and how did you do against the mid (" + Q.mid + ")?",
        options: [
          { t: opt(lifted ? "Short" : "Long", true), ok: true },
          { t: opt(lifted ? "Long" : "Short", true) },
          { t: opt(lifted ? "Short" : "Long", false) },
          { t: opt(lifted ? "Long" : "Short", false) }
        ],
        explain: lifted
          ? "The client bought from you, so you're short " + n + ". You sold at " + Q.a + ", " + half + " above the mid: " + half + " × " + n + " = " + edge + " of edge."
          : "The client sold to you, so you're long " + n + ". You bought at " + Q.b + ", " + half + " below the mid: " + half + " × " + n + " = " + edge + " of edge."
      };
    },

    function mmSkew() {
      const Q = makeQuote();
      const n = rnd(20, 200);
      const long = Math.random() < 0.5;
      const b = Q.bidT, a = Q.bidT + Q.sprT, p = Q.px;
      const down = p(b - 1) + " at " + p(a - 1), up = p(b + 1) + " at " + p(a + 1);
      return {
        tag: "Market maker · Managing inventory",
        prompt: "You're the market maker quoting " + q(Q.text) + ". After a busy morning you're <b>" + (long ? "long " : "short ") + n + "</b>, more than you want to hold. How do you adjust your quote?",
        options: [
          { t: (long ? down : up) + " (shift " + (long ? "down" : "up") + ")", ok: true },
          { t: (long ? up : down) + " (shift " + (long ? "up" : "down") + ")" },
          { t: p(b - 1) + " at " + p(a + 1) + " (widen both sides)" },
          { t: Q.text + " (leave it and wait)" }
        ],
        explain: long
          ? "Long means you want to sell. A lower offer attracts buyers, and a lower bid makes clients less likely to sell you more."
          : "Short means you want to buy. A higher bid attracts sellers, and a higher offer makes clients less likely to buy more from you."
      };
    },

    function mmWidth() {
      const Q = makeQuote();
      const s = pick([
        { t: "A big earnings announcement is due in five minutes.", a: "Widen", why: "Fair value could jump on the news, so you need more cushion against trading at a stale price." },
        { t: "A client asks for a price in ten times your usual size.", a: "Widen", why: "Bigger size means more risk to hedge or unwind, so you charge more for it." },
        { t: "You're unsure of fair value; the product barely trades.", a: "Widen", why: "The less sure you are of value, the more edge you need to cover being wrong." },
        { t: "The market has gone quiet and volatility has dropped.", a: "Tighten", why: "Less risk of the price moving against you means you can quote tighter and win more flow." },
        { t: "Several competitors are now quoting tighter than you, and you're getting no trades.", a: "Tighten", why: "If your price is never the best, you trade nothing. Tighten to compete for flow." }
      ]);
      return {
        tag: "Market maker · Spread width",
        prompt: "You're the market maker quoting " + q(Q.text) + ". " + s.t + " What do you do with your spread?",
        options: [{ t: "Widen", ok: s.a === "Widen" }, { t: "Tighten", ok: s.a === "Tighten" }, { t: "Leave it unchanged" }],
        fixedOrder: true,
        explain: s.a + ". " + s.why
      };
    }
  ];

  // ---------- persistence ----------
  const KEY = "tradingDrill.sessions.v1";
  function loadSessions() {
    try { const v = JSON.parse(localStorage.getItem(KEY) || "[]"); return Array.isArray(v) ? v : []; }
    catch (e) { return []; }
  }
  function saveSessions(list) {
    try { localStorage.setItem(KEY, JSON.stringify(list.slice(-100))); } catch (e) { /* storage unavailable */ }
  }

  let sessions = loadSessions();
  let current = null;
  function newSession() { current = { id: Date.now(), date: new Date().toISOString(), correct: 0, total: 0 }; streak = 0; }
  function persistCurrent() {
    if (!current || current.total === 0) return;
    const i = sessions.findIndex((s) => s.id === current.id);
    if (i >= 0) sessions[i] = Object.assign({}, current); else sessions.push(Object.assign({}, current));
    saveSessions(sessions);
  }

  // ---------- rendering ----------
  const $ = (id) => document.getElementById(id);
  let streak = 0;
  let lastTemplate = -1;
  let state = null; // { q, answered }

  function fmtDate(iso) {
    const d = new Date(iso);
    return d.toLocaleDateString(undefined, { month: "short", day: "numeric" }) + ", " +
      d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
  }

  function renderHistory() {
    const rows = sessions.slice().reverse();
    if (!rows.length) {
      $("history").innerHTML = '<p class="empty">No sessions yet. Answer a question and it will be saved here.</p>';
      $("clear-slot").hidden = true;
      return;
    }
    $("clear-slot").hidden = false;
    $("history").innerHTML =
      '<div class="table-scroll"><table><thead><tr><th>Date</th><th class="r">Score</th><th class="r">Accuracy</th></tr></thead><tbody>' +
      rows.map((s) => {
        const cur = current && s.id === current.id;
        return '<tr class="' + (cur ? "current" : "") + '"><td>' + fmtDate(s.date) + (cur ? " · now" : "") +
          '</td><td class="r">' + s.correct + " / " + s.total +
          '</td><td class="r">' + Math.round((100 * s.correct) / s.total) + "%</td></tr>";
      }).join("") + "</tbody></table></div>";
  }

  function renderScore() {
    $("s-score").textContent = current.correct + " / " + current.total;
    $("s-acc").textContent = current.total ? Math.round((100 * current.correct) / current.total) + "%" : "—";
    $("s-streak").textContent = streak;
  }

  function nextQuestion() {
    let i;
    do { i = rnd(0, templates.length - 1); } while (i === lastTemplate);
    lastTemplate = i;
    const qn = templates[i]();
    if (!qn.text && !qn.fixedOrder) qn.options = shuffle(qn.options);
    state = { q: qn, answered: false };
    renderQuestion();
  }

  function renderQuestion() {
    const qn = state.q;
    let body = '<span class="label">' + qn.tag + '</span><p class="prompt">' + qn.prompt + "</p>";
    if (qn.text) {
      body += '<form class="textrow" id="text-form" autocomplete="off">' +
        '<input id="text-answer" inputmode="decimal" placeholder="' + qn.placeholder + '" aria-label="Your answer">' +
        '<button class="btn" type="submit">Check</button></form>' +
        '<p class="hint" id="text-hint">Type a number (or a sum like 88.5 − 87.5) and press Enter.</p>';
    } else {
      body += '<div class="options" role="group" aria-label="Answers">' +
        qn.options.map((o, k) => '<button class="opt" type="button" data-k="' + k + '"><kbd>' + (k + 1) + "</kbd><span>" + o.t + "</span></button>").join("") +
        "</div>";
    }
    body += '<div id="feedback-slot"></div>';
    $("card").innerHTML = body;

    if (qn.text) {
      const input = $("text-answer");
      $("text-form").addEventListener("submit", (e) => {
        e.preventDefault();
        if (state.answered) return;
        const v = evalAnswer(input.value);
        if (isNaN(v)) {
          const hint = $("text-hint");
          hint.textContent = input.value.trim() === ""
            ? "Type your answer first."
            : "Couldn't read “" + input.value.trim() + "”. Enter a number like 1.5 (sums like 88.5 − 87.5 work too).";
          hint.classList.add("err");
          input.focus();
          return;
        }
        input.disabled = true;
        e.target.querySelector("button").disabled = true;
        answer(qn.check(v));
      });
      input.focus({ preventScroll: true });
    } else {
      $("card").querySelectorAll(".opt").forEach((b) => b.addEventListener("click", () => choose(Number(b.dataset.k))));
    }
  }

  function choose(k) {
    if (state.answered) return;
    const qn = state.q;
    const ok = !!qn.options[k].ok;
    $("card").querySelectorAll(".opt").forEach((b, idx) => {
      b.disabled = true;
      if (qn.options[idx].ok) b.classList.add("is-correct");
      else if (idx === k) b.classList.add("is-wrong");
      else b.classList.add("dim");
    });
    answer(ok);
  }

  function answer(ok) {
    const qn = state.q;
    state.answered = true;
    current.total++;
    if (ok) { current.correct++; streak++; } else { streak = 0; }
    persistCurrent();
    renderScore();
    renderHistory();

    const verdict = ok ? "Correct" : "Incorrect" + (qn.text ? ": it's " + qn.answer : "");
    $("feedback-slot").innerHTML =
      '<div class="feedback ' + (ok ? "good" : "bad") + '" role="status"><span class="verdict">' + verdict +
      '</span><p class="explain">' + qn.explain + "</p></div>" +
      '<div class="next-row" style="margin-top:16px"><span class="keys">Enter for next</span>' +
      '<button class="btn" id="next-btn" type="button">Next question →</button></div>';
    const nb = $("next-btn");
    nb.addEventListener("click", nextQuestion);
    nb.focus({ preventScroll: true });
  }

  // Keyboard: 1–4 to answer, Enter for next.
  document.addEventListener("keydown", (e) => {
    if (!state || e.metaKey || e.ctrlKey || e.altKey) return;
    if (state.answered && e.key === "Enter" && document.activeElement && document.activeElement.id !== "next-btn") {
      e.preventDefault(); nextQuestion(); return;
    }
    if (!state.answered && !state.q.text) {
      const n = Number(e.key);
      if (n >= 1 && n <= state.q.options.length) choose(n - 1);
    }
  });

  $("new-session").addEventListener("click", () => {
    persistCurrent();
    newSession();
    renderScore(); renderHistory(); nextQuestion();
  });

  // In-page confirm for clearing history (no native dialogs).
  $("clear-slot").addEventListener("click", (e) => {
    const t = e.target;
    if (t.id === "clear-btn") {
      $("clear-slot").innerHTML = '<span class="confirm">Delete all saved sessions? ' +
        '<button class="linkbtn" id="clear-yes" type="button">Delete</button>' +
        '<button class="linkbtn" id="clear-no" type="button">Keep</button></span>';
    } else if (t.id === "clear-yes" || t.id === "clear-no") {
      if (t.id === "clear-yes") { sessions = []; saveSessions(sessions); current.total = 0; current.correct = 0; streak = 0; renderScore(); }
      $("clear-slot").innerHTML = '<button class="linkbtn" id="clear-btn" type="button">Clear history</button>';
      renderHistory();
    }
  });

  newSession();
  renderScore();
  renderHistory();
  nextQuestion();
})();
</script>

</body></html>
